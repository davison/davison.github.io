name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    # Daily at 00:05 UTC — promotes any drafts whose date has arrived.
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; cancel in-progress runs when a new commit lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install zensical
      - run: python3 main.py
      - run: zensical build --clean
      # GitHub Pages serves repo contents directly — disable its default
      # Jekyll build so it doesn't second-guess the zensical output.
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
