# ============================================================================
# Zensical configuration for davison.github.io
#
# The blog-posts block between BEGIN_BLOG_POSTS / END_BLOG_POSTS is rewritten
# by main.py — do not edit it by hand.
# ============================================================================

[project]

site_name = "davison online"
site_description = "a home for things that had no better place to be."
site_author = "Darren Davison"
site_url = "https://davison.github.io/"

copyright = """
Copyright &copy; 2026 Darren Davison
"""

nav = [
  { "Home" = "index.md" },
  { "About" = "about.md" },
  { "Blog" = [
    { "Latest" = "blog/index.md" },
    # BEGIN_BLOG_POSTS
    # END_BLOG_POSTS
    { "All posts..." = "blog/archive.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

custom_dir = "docs/overrides"

favicon = "assets/images/favicon.ico"

language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Extra
# ----------------------------------------------------------------------------
[project.extra]
generator = false

# Pin __md_scope so 404 and real pages share localStorage keys for palette
# preferences. Kept at "/" because site_url has no path component.
scope = "/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/davison"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/davisononline"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:darren@davisononline.org"
name = "Email"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
